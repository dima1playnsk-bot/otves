<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Отвес — бизнесы без сайта</title>
  <meta name="description" content="Бизнесы Новосибирска без своего сайта на карте. Данные OpenStreetMap.">
  <meta name="theme-color" content="#121316">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.css">
  <link rel="stylesheet" href="styles.css?v=nsk8">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/4.7.1/maplibre-gl.js" defer></script>
  <script src="app.js?v=nsk8" defer></script>
</head>
<body>
  <div class="side">
    <header class="top">
      <span class="logo">Отвес</span>
      <div class="tabs" role="tablist" aria-label="Разделы">
        <button class="tab" role="tab" id="tabSearch" aria-selected="true" aria-controls="viewSearch" data-view="search">Поиск</button>
        <button class="tab" role="tab" id="tabLeads" aria-selected="false" aria-controls="viewLeads" data-view="leads" tabindex="-1">Лиды <span class="tab-count" id="leadCount">0</span></button>
      </div>
    </header>

    <section class="controls" id="controls" aria-label="Поиск">
      <button class="btn-main" id="searchBtn" type="button">Искать</button>
      <p class="status" id="status" aria-live="polite">Новосибирск</p>
    </section>

    <div class="map-wrap" id="mapWrap">
      <div class="map" id="map" role="region" aria-label="Карта"></div>
    </div>

    <section class="view" id="viewSearch" role="tabpanel" aria-labelledby="tabSearch">
      <div class="results" id="results" hidden>
        <p class="summary" id="summary"></p>

        <div class="chips" id="cats" aria-label="Виды бизнеса"></div>

        <div class="filters">
          <input class="input" id="fName" type="search" placeholder="Название" aria-label="Поиск по названию">
          <label class="check"><input type="checkbox" id="fPhone"><span>С телефоном</span></label>
          <label class="check"><input type="checkbox" id="fChains" checked><span>Без сетей</span></label>
          <label class="check"><input type="checkbox" id="fSites"><span>С сайтом тоже</span></label>
          <select class="select" id="fStatus" aria-label="Статус">
            <option value="all">Все статусы</option>
            <option value="new">Новые</option>
            <option value="work">В работе</option>
            <option value="closed">Не работают</option>
          </select>
        </div>

        <ol class="list" id="list"></ol>
        <button class="btn more" id="moreBtn" type="button" hidden>Ещё</button>
      </div>
    </section>

    <section class="view" id="viewLeads" role="tabpanel" aria-labelledby="tabLeads" hidden>
      <div class="leads-head">
        <p class="summary" id="leadsSum"></p>
        <button class="btn" id="exportBtn" type="button">Скачать CSV</button>
      </div>
      <ol class="list" id="leadList"></ol>
      <p class="empty" id="leadsEmpty" hidden>Пусто. Поставьте статус бизнесу — он появится здесь.</p>
    </section>

    <footer class="foot">© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>. Сайт может быть, даже если его нет в OSM.</footer>
  </div>
</body>
</html>
