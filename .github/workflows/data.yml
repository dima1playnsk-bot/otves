name: Обновить данные городов

on:
  schedule:
    - cron: '0 2 * * *' # каждый день в 9:00 по Новосибирску
  workflow_dispatch:
    inputs:
      skip_osm:
        description: 'Не качать OpenStreetMap (взять прошлые данные)'
        type: boolean
        default: false

permissions:
  contents: write
  pages: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fetch-data.mjs
        if: ${{ !inputs.skip_osm }}
        continue-on-error: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install overturemaps duckdb
      - run: python scripts/merge-overture.py
      - name: Сохранить в репозиторий
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.json
          if git diff --cached --quiet; then
            echo "Данные не изменились"
          else
            git commit -m "Обновлены данные городов"
            git push
            gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
          fi
